name: Bug report
description: Report a packaging, plugin compatibility, or integration problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include what you know; reproduction steps and upstream testing are not required.
        Remove secrets and private information from logs before posting.
  - type: checkboxes
    id: project-scope
    attributes:
      label: Project scope
      description: >
        nix-opendeck handles Nix packaging, modules, integration,
        and downstream compatibility patches. Bugs affecting
        OpenDeck or individual plugins independently of nix-opendeck
        should generally be reported to their respective upstream projects.
      options:
        - label: >
            To the best of my knowledge, this issue concerns
            nix-opendeck rather than solely an upstream project.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
      placeholder: Describe the observed and expected behaviour.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component or plugin
      placeholder: e.g. opendeck-core or an OpenDeck plugin name
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: If known; include relevant configuration or commands.
  - type: input
    id: os
    attributes:
      label: OS / distribution
      placeholder: e.g. NixOS unstable
  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: e.g. x86_64-linux
  - type: dropdown
    id: installation-method
    attributes:
      label: Installation method
      description: How is OpenDeck installed and configured?
      options:
        - Home Manager module
        - NixOS / nix-darwin / standalone Nix (without Home Manager module)
        - Other / not sure
    validations:
      required: false
  - type: dropdown
    id: opendeck-package
    attributes:
      label: OpenDeck package
      description: The Home Manager module uses the default package unless overridden.
      options:
        - Default opendeck (StarterPack bundled)
        - opendeck-with-plugins (all eligible plugins bundled)
        - Custom wrapOpenDeck bundle
        - opendeck-core (no bundled plugins)
        - Other / not sure
    validations:
      required: false
  - type: textarea
    id: plugin-configuration
    attributes:
      label: Additional plugins (if relevant)
      description: >
        If the issue isn't related to a specific plugin,
        List any additional plugins bundled through wrapOpenDeck
        or managed separately through programs.opendeck.plugins.
        Include relevant configuration snippets if useful.
      placeholder: |
        Bundled plugins:
        Home Manager plugins:
    validations:
      required: false
  - type: input
    id: revision
    attributes:
      label: nix-opendeck revision (if known)
      placeholder: Git commit or flake revision
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: |
        Include relevant errors or logs. You may attach files or screenshots here.
        Mention whether the problem also occurs in an ordinary upstream installation, if known.
        Remove secrets and other private information before posting.
