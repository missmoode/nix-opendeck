name: Bug report
description: Report a packaging, plugin compatibility, or integration problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include what you know; reproduction steps and upstream testing are not required.
        Remove secrets and private information from logs before posting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
      placeholder: Describe the observed and expected behaviour.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component or plugin
      placeholder: e.g. opendeck-core or an OpenDeck plugin name
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: If known; include relevant configuration or commands.
  - type: input
    id: os
    attributes:
      label: OS / distribution
      placeholder: e.g. NixOS unstable
  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: e.g. x86_64-linux
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Home Manager
        - Bundled OpenDeck package
        - Standalone Nix package
        - Other / not sure
  - type: input
    id: revision
    attributes:
      label: nix-opendeck revision (if known)
      placeholder: Git commit or flake revision
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: |
        Include relevant errors or logs. You may attach files or screenshots here.
        Mention whether the problem also occurs in an ordinary upstream installation, if known.
        Remove secrets and other private information before posting.
