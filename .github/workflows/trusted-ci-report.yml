# Trusted reporter from main; never executes PR code or reads PR artifacts.
name: Trusted CI report

on:
  workflow_run:
    workflows: [Checks, Package verification]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: trusted-automation
      deployment: false

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-statuses: write
          permission-pull-requests: write

      - name: Verify provenance and publish trusted result
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          UPDATE_MAINTAINERS: ${{ vars.UPDATE_MAINTAINERS }}
        run: python3 .github/ci/trusted_ci_report.py
