# Spot-check the default OpenDeck package against its independently built
# artifact published to Cachix.
name: Reproducibility Spot-check

on:
  schedule:
    # Away from the top of the hour, when GitHub schedules are often delayed.
    - cron: '17 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-opendeck-maintenance-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-reference:
    name: Ensure cached references exist
    uses: ./.github/workflows/cache.yml
    secrets: inherit

  opendeck:
    needs: prepare-reference
    name: 'Check: ${{ matrix.system }}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    env:
      TARGET_SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          skipPush: true

      - name: Fetch published OpenDeck reference
        shell: bash
        run: |
          set -euo pipefail

          attr=".#packages.${TARGET_SYSTEM}.opendeck"
          output="$(nix eval --raw "${attr}.outPath")"
          [[ "$output" == /nix/store/* ]] || {
            echo "Unexpected output path: $output" >&2
            exit 1
          }

          # Require the exact output to be published in Cachix.
          # Query only the top-level path: its dependencies may live in other caches.
          echo "Checking reference in Cachix: $output"
          nix path-info --store https://nix-opendeck.cachix.org "$output"

          # Download via the configured substituters (Cachix and cache.nixos.org).
          # Never build a missing reference locally, or the comparison would
          # silently become a same-run double build instead of a cache comparison.
          nix build "$attr" --max-jobs 0 --no-link -L
          nix path-info "$output"

          {
            echo '## Reference artifact'
            echo
            echo "- Flake output: \`packages.${TARGET_SYSTEM}.opendeck\`"
            echo "- Store path: \`$output\`"
            echo '- Source: nix-opendeck Cachix cache'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild OpenDeck and compare outputs
        shell: bash
        run: |
          set -euo pipefail
          attr=".#packages.${TARGET_SYSTEM}.opendeck"

          # --rebuild runs the top-level derivation again and compares it with
          # the cached output. Its dependencies may still be substituted.
          # Do NOT disable substitution: rebuilding the entire closure is not
          # necessary for this spot-check.
          nix build "$attr" \
            --rebuild \
            --no-link \
            --keep-failed \
            -L

          {
            echo
            echo '## Result'
            echo
            echo 'OpenDeck reproduced the published output bit-for-bit.'
            echo
            echo 'This checks the top-level OpenDeck output only;'
            echo 'it does not independently rebuild every dependency or plugin.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose reproducibility failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail

          output="$(nix eval --raw \
            ".#packages.${TARGET_SYSTEM}.opendeck.outPath")"
          rebuilt="${output}.check"

          if [[ ! -d "$rebuilt" ]]; then
            echo "Rebuilt output was not preserved"
            exit 0
          fi

          echo "=== Differing files ==="
          diff -qr "$output" "$rebuilt" || true

          if [[ "$TARGET_SYSTEM" == *-linux ]]; then
            echo "=== Permissions and symlink differences ==="
            diff -u \
              <(cd "$output" && find . -printf '%P\t%m\t%l\n' | sort) \
              <(cd "$rebuilt" && find . -printf '%P\t%m\t%l\n' | sort) \
              || true
          fi

          if [[ "$TARGET_SYSTEM" == *-darwin ]]; then
            echo "=== Code signatures ==="
            for path in "$output" "$rebuilt"; do
              echo "--- $path ---"
              codesign -dv --verbose=4 \
                "$path/Applications/OpenDeck.app" 2>&1 \
                | grep -E 'Signature|CodeDirectory|CDHash|flags' \
                || true
            done
          fi
