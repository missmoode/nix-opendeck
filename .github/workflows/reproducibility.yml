# Spot-check OpenDeck and its plugins for reproducibility.
# Compare against independently published outputs where available, or build
# a local reference for plugins that cannot be obtained from the cache.
name: Reproducibility Spot-check

on:
  schedule:
    # Away from the top of the hour, when GitHub schedules are often delayed.
    - cron: '17 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-opendeck-maintenance-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-reference:
    name: Ensure cached references exist
    uses: ./.github/workflows/cache.yml
    secrets: inherit

  discover:
    name: Discover reproducibility targets
    needs: prepare-reference
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Discover available packages
        id: targets
        shell: bash
        run: |
          set -euo pipefail

          # Reuse the platform-filtered catalogue from the cache workflow.
          # Reproducibility testing includes non-redistributable plugins.
          nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              systems = builtins.attrNames flake.packages;
            in
              builtins.concatLists (map (system:
                let
                  targets = import ./.github/ci/targets.nix {
                    inherit flake system;
                  };
                in
                  [ targets.opendeck ] ++ targets.plugins
              ) systems)
          ' | jq -c '{
            include: [
              .[] | {
                kind,
                system,
                runner,
                attr,
                label,
                redistributable
              }
            ]
          }' > "$RUNNER_TEMP/repro-matrix.json"

          echo "matrix=$(cat "$RUNNER_TEMP/repro-matrix.json")" \
            >> "$GITHUB_OUTPUT"

          {
            echo '## Reproducibility targets'
            echo
            echo "Total targets: $(jq '.include | length' "$RUNNER_TEMP/repro-matrix.json")"
            echo
            echo 'Non-redistributable packages are tested without publishing binary artifacts.'
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: 'Check: ${{ matrix.system }} / ${{ matrix.label }}'
    needs: discover
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    strategy:
      max-parallel: 6
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    env:
      TARGET_SYSTEM: ${{ matrix.system }}
      TARGET_KIND: ${{ matrix.kind }}
      TARGET_ATTR: ${{ matrix.attr }}
      TARGET_LABEL: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          skipPush: true

      - name: Fetch or build reference
        shell: bash
        run: |
          set -euo pipefail

          attr=".#${TARGET_ATTR}"
          output="$(nix eval --raw "${attr}.outPath")"

          [[ "$output" == /nix/store/* ]] || {
            echo "Unexpected output path: $output" >&2
            exit 1
          }

          if [[ "$TARGET_KIND" == opendeck ]]; then
            # OpenDeck must have an independently published Cachix reference.
            # Never silently replace it with a local build.
            echo "Checking published reference in Cachix: $output"

            nix path-info \
              --store https://nix-opendeck.cachix.org \
              "$output"

            # Substitution only; never build a missing reference locally.
            nix build "$attr" --max-jobs 0 --no-link -L
          else
            # Plugins may be absent from Cachix, including for licensing
            # reasons. Substitute where possible; otherwise build locally.
            nix build "$attr" --no-link -L
          fi

          nix path-info "$output"

          {
            echo '## Reference'
            echo
            echo "- Target: \`${TARGET_ATTR}\`"
            echo "- Store path: \`$output\`"

            if [[ "$TARGET_KIND" == opendeck ]]; then
              echo '- Source: nix-opendeck Cachix cache'
            else
              echo '- Source: configured substituter or local build'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild and compare outputs
        shell: bash
        run: |
          set -euo pipefail

          attr=".#${TARGET_ATTR}"

          # Rebuild the selected derivation and compare against its reference.
          # Dependencies may still be substituted; they are not rebuilt here.
          nix build "$attr" \
            --rebuild \
            --no-link \
            --keep-failed \
            -L

          {
            echo
            echo '## Result'
            echo
            echo "${TARGET_LABEL} reproduced the reference output bit-for-bit."
            echo
            echo 'This checks the selected derivation, not every dependency.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose reproducibility failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail

          output="$(nix eval --raw ".#${TARGET_ATTR}.outPath")"
          rebuilt="${output}.check"

          if [[ ! -d "$output" || ! -d "$rebuilt" ]]; then
            echo "Both outputs are not available for comparison."
            exit 0
          fi

          echo "=== Differing files ==="
          diff -qr "$output" "$rebuilt" || true

          if [[ "$TARGET_SYSTEM" == *-linux ]]; then
            echo "=== Permissions and symlink differences ==="
            diff -u \
              <(cd "$output" && find . -printf '%P\t%m\t%l\n' | sort) \
              <(cd "$rebuilt" && find . -printf '%P\t%m\t%l\n' | sort) \
              || true
          fi

          # Only the OpenDeck macOS application has this bundle layout.
          # Plugin outputs must not be assumed to contain an .app bundle.
          if [[ "$TARGET_KIND" == opendeck && "$TARGET_SYSTEM" == *-darwin ]]; then
            echo "=== Code signatures ==="
            for path in "$output" "$rebuilt"; do
              echo "--- $path ---"
              codesign -dv --verbose=4 \
                "$path/Applications/OpenDeck.app" 2>&1 \
                | grep -E 'Signature|CodeDirectory|CDHash|flags' \
                || true
            done
          fi

      - name: Archive non-reproducible outputs
        if: ${{ failure() && matrix.redistributable }}
        shell: bash
        run: |
          set -euo pipefail

          output="$(nix eval --raw ".#${TARGET_ATTR}.outPath")"
          rebuilt="${output}.check"

          if [[ ! -d "$output" || ! -d "$rebuilt" ]]; then
            echo "Both outputs are not available; skipping archival."
            exit 0
          fi

          archive_dir="$RUNNER_TEMP/opendeck-repro"
          mkdir -p "$archive_dir"

          # Preserve permissions, symlinks and binary contents.
          tar -C "$output" -cf "$archive_dir/reference.tar" .
          tar -C "$rebuilt" -cf "$archive_dir/rebuilt.tar" .

          printf 'Target: %s\nSystem: %s\nReference: %s\nRebuilt: %s\n' \
            "$TARGET_ATTR" "$TARGET_SYSTEM" "$output" "$rebuilt" \
            > "$archive_dir/paths.txt"

      - name: Upload reproducibility artifacts
        if: ${{ failure() && matrix.redistributable }}
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ matrix.system }}-${{ matrix.attr }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opendeck-repro/
          if-no-files-found: ignore
          retention-days: 7
