# Rebuild only packages whose Nix output paths differ from the PR's base.
# This tests the proposed merge result, not just the contributor's branch.
name: Reproducibility

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: nix-opendeck-pr-repro-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover changed packages
    if: contains(github.event.pull_request.labels.*.name, 'ready for merge')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      targets: ${{ steps.compare.outputs.targets }}
      jobs: ${{ steps.compare.outputs.jobs }}

    steps:
      # The default PR checkout is GitHub's proposed merge commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Compare evaluated package outputs with main
        id: compare
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Compare with the exact base used for this PR, not whichever
          # commit happens to be on main by the time this job executes.
          git cat-file -e "${BASE_SHA}^{commit}"
          git worktree add --detach "$RUNNER_TEMP/repro-base" "$BASE_SHA"

          evaluate_targets() {
            local directory="$1"
            local output="$2"
            (
              cd "$directory"
              nix eval --impure --json --expr '
                let
                  flake = builtins.getFlake (toString ./.);
                  systems = builtins.attrNames flake.packages;
                in
                  builtins.concatLists (map (system:
                    let
                      targets = import ./.github/ci/targets.nix {
                        inherit flake system;
                      };
                    in
                      [ targets.core targets.opendeck ] ++ targets.plugins
                  ) systems)
              '
            ) > "$output"
          }

          evaluate_targets "$RUNNER_TEMP/repro-base" "$RUNNER_TEMP/base-targets.json"
          evaluate_targets "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pr-targets.json"

          # Each attr includes the system, making it a unique target key.
          # Missing (new) PR targets are selected automatically.
          jq -c --slurpfile base "$RUNNER_TEMP/base-targets.json" '
            ($base[0] | map({key: .attr, value: .storePath}) | from_entries) as $old
            | [ .[]
                | select(.storePath != ($old[.attr] // null))
                | {kind, system, runner, attr, label, redistributable}
              ]
          ' "$RUNNER_TEMP/pr-targets.json" > "$RUNNER_TEMP/changed-targets.json"

          # Group changed core/wrapper targets by platform so they share a Nix
          # store and run in dependency order. Keep plugins in separate jobs.
          jq -c '
            ([.[] | select(.kind == "core" or .kind == "opendeck")]
              | group_by(.system)
              | map(sort_by(if .kind == "core" then 0 else 1 end)
                | {
                    system: .[0].system,
                    runner: .[0].runner,
                    label: (map(.label) | join(" + ")),
                    targets: .
                  }))
            + ([.[] | select(.kind == "plugin")]
              | map({system, runner, label, targets: [.] }))
          ' "$RUNNER_TEMP/changed-targets.json" > "$RUNNER_TEMP/check-jobs.json"

          echo "targets=$(cat "$RUNNER_TEMP/changed-targets.json")" >> "$GITHUB_OUTPUT"
          echo "jobs=$(cat "$RUNNER_TEMP/check-jobs.json")" >> "$GITHUB_OUTPUT"

          {
            echo '## Changed package outputs'
            echo
            echo "- PR targets: $(jq 'length' "$RUNNER_TEMP/pr-targets.json")"
            echo "- Changed/new targets: $(jq 'length' "$RUNNER_TEMP/changed-targets.json")"
            echo "- Native runner jobs: $(jq 'length' "$RUNNER_TEMP/check-jobs.json")"
            echo
            if [[ "$(jq 'length' "$RUNNER_TEMP/changed-targets.json")" -eq 0 ]]; then
              echo 'No changed package outputs require a reproducibility rebuild.'
            else
              jq -r '.[] | "- `\(.system)` / `\(.label)`"' "$RUNNER_TEMP/changed-targets.json"
            fi
            echo
            echo 'Selection compares evaluated output paths; removed targets are not rebuilt.'
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: 'Rebuild: ${{ matrix.system }} / ${{ matrix.label }}'
    needs: discover
    if: ${{ needs.discover.result == 'success' && needs.discover.outputs.jobs != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.jobs) }}

    env:
      TARGET_SYSTEM: ${{ matrix.system }}
      TARGETS_JSON: ${{ toJSON(matrix.targets) }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          skipPush: true

      - name: Build and independently rebuild changed targets
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail

          results="$RUNNER_TEMP/repro-results.jsonl"
          archive_root="$RUNNER_TEMP/opendeck-repro"
          : > "$results"
          failed=false

          verify_macos_bundle() {
            local attr="$1" output="$2" app plugin_dir plugin_ids id
            app="$output/Applications/OpenDeck.app"
            plugin_dir="$app/Contents/Resources/plugins"

            echo 'Checking native architecture and application structure'
            [[ "$(uname -m)" == arm64 ]] || return 1
            test -x "$app/Contents/MacOS/opendeck" || return 1
            test -d "$plugin_dir" || return 1
            test -x "$output/bin/opendeck" || return 1

            echo 'Checking bundled plugin manifests'
            plugin_ids="$(nix eval --json ".#${attr}.bundledPluginIds")" || return 1
            jq -e 'type == "array" and length > 0' <<< "$plugin_ids" > /dev/null || return 1
            while IFS= read -r id; do
              echo "Checking plugin: $id"
              test -f "$plugin_dir/$id/manifest.json" || return 1
            done < <(jq -r '.[]' <<< "$plugin_ids")

            echo 'Verifying application signature'
            codesign --verify --deep --strict --verbose=2 "$app" || return 1
            codesign --display --verbose=4 "$app" || return 1
          }

          # Nix --rebuild rebuilds the selected derivation, not its dependencies.
          # If core changed, its reference remains in this runner's Nix store
          # when we subsequently build and check the wrapper.
          while IFS= read -r target; do
            kind="$(jq -r '.kind' <<< "$target")"
            attr="$(jq -r '.attr' <<< "$target")"
            label="$(jq -r '.label' <<< "$target")"
            redistributable="$(jq -r '.redistributable' <<< "$target")"
            reference=failed
            bundle=skipped
            rebuild=skipped
            output=""

            echo "::group::${TARGET_SYSTEM} / ${label}"
            echo "Reference: .#${attr}"

            # The PR's output may be substituted or built locally; never publish it.
            if output="$(nix eval --raw ".#${attr}.outPath")" \
              && [[ "$output" == /nix/store/* ]] \
              && nix build ".#${attr}" --no-link -L \
              && nix path-info "$output"; then
              reference=success
            fi

            # Preserve the original macOS bundle check, after the reference
            # is available and before the independent reproducibility rebuild.
            if [[ "$reference" == success && "$kind" == opendeck && "$TARGET_SYSTEM" == *-darwin ]]; then
              if verify_macos_bundle "$attr" "$output"; then
                bundle=success
              else
                bundle=failed
              fi
            fi

            if [[ "$reference" == success && "$bundle" != failed ]]; then
              echo "Independently rebuilding: .#${attr}"
              if nix build ".#${attr}" --rebuild --no-link --keep-failed -L; then
                rebuild=success
              else
                rebuild=failed
              fi
            fi

            if [[ "$reference" != success || "$bundle" == failed || "$rebuild" != success ]]; then
              failed=true
              rebuilt="${output}.check"

              if [[ -d "$output" && -d "$rebuilt" ]]; then
                echo '=== Differing files ==='
                diff -qr "$output" "$rebuilt" || true

                if [[ "$TARGET_SYSTEM" == *-linux ]]; then
                  echo '=== Permissions and symlink differences ==='
                  diff -u \
                    <(cd "$output" && find . -printf '%P\t%m\t%l\n' | sort) \
                    <(cd "$rebuilt" && find . -printf '%P\t%m\t%l\n' | sort) \
                    || true
                fi

                if [[ "$TARGET_SYSTEM" == *-darwin && ( "$kind" == core || "$kind" == opendeck ) ]]; then
                  echo '=== Code signatures ==='
                  for path in "$output" "$rebuilt"; do
                    echo "--- $path ---"
                    codesign -dv --verbose=4 \
                      "$path/Applications/OpenDeck.app" 2>&1 \
                      | grep -E 'Signature|CodeDirectory|CDHash|flags' \
                      || true
                  done
                fi

                if [[ "$redistributable" == true ]]; then
                  archive_dir="$archive_root/$TARGET_SYSTEM/$kind"
                  mkdir -p "$archive_dir"
                  tar -C "$output" -cf "$archive_dir/reference.tar" .
                  tar -C "$rebuilt" -cf "$archive_dir/rebuilt.tar" .
                  printf 'Target: %s\nSystem: %s\nReference: %s\nRebuilt: %s\n' \
                    "$attr" "$TARGET_SYSTEM" "$output" "$rebuilt" \
                    > "$archive_dir/paths.txt"
                fi
              else
                echo 'Both reference and rebuilt outputs are not available for comparison.'
              fi
            fi

            jq -nc \
              --arg label "$label" \
              --arg reference "$reference" \
              --arg bundle "$bundle" \
              --arg rebuild "$rebuild" \
              '{label: $label, reference: $reference, bundle: $bundle, rebuild: $rebuild}' \
              >> "$results"
            echo '::endgroup::'

            # Avoid building a wrapper whose core has just failed; remaining
            # targets are reported as skipped in the job summary.
            if [[ "$failed" == true ]]; then
              break
            fi
          done < <(jq -c '.[]' <<< "$TARGETS_JSON")

          [[ "$failed" == false ]]

      - name: Upload reproducibility artifacts
        id: repro_artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-repro-${{ matrix.system }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/opendeck-repro/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize result
        if: ${{ always() }}
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.repro_artifact.outputs.artifact-url }}
          CHECK_OUTCOME: ${{ steps.rebuild.outcome }}
        run: |
          set -euo pipefail

          {
            echo '## Reproducibility result'
            echo
            echo "**${TARGET_SYSTEM}**"
            echo
            if [[ -s "$RUNNER_TEMP/repro-results.jsonl" ]]; then
              jq -r '
                "- **\(.label)**: " +
                (if .reference != "success" then "reference acquisition/build failed"
                 elif .bundle == "failed" then "macOS bundle validation failed"
                 elif .rebuild == "success" then "reproduced bit-for-bit"
                 else "rebuild failed or differs from reference" end)
              ' "$RUNNER_TEMP/repro-results.jsonl"
            else
              echo 'No checks completed. See the job logs.'
            fi
            echo
            if [[ -s "$RUNNER_TEMP/repro-results.jsonl" ]]; then
              checked="$(wc -l < "$RUNNER_TEMP/repro-results.jsonl" | tr -d ' ')"
              expected="$(jq 'length' <<< "$TARGETS_JSON")"
              if (( checked < expected )); then
                echo 'Remaining targets were skipped after an earlier failure.'
                echo
              fi
            fi
            if [[ "$CHECK_OUTCOME" != success ]]; then
              echo 'See the build logs and diagnostics above for the failure.'
            fi
            if [[ -n "$ARTIFACT_URL" ]]; then
              echo
              echo "[Download differing outputs]($ARTIFACT_URL) (retained for 7 days)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  result:
    name: Verify reproducibility
    needs: [discover, check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Report reproducibility result
        shell: bash
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TARGETS: ${{ needs.discover.outputs.targets }}
        run: |
          set -euo pipefail

          if [[ "$DISCOVER_RESULT" == skipped ]]; then
            echo 'Reproducibility has not been requested.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Add the `ready for merge` label when this PR is ready.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo '## Reproducibility Verification'
            echo
            if [[ "$DISCOVER_RESULT" != success ]]; then
              echo '**Failed — flake evaluation or target discovery failed.**'
              echo 'See the Discover changed packages job logs.'
            elif [[ "$TARGETS" == '[]' ]]; then
              echo '**Passed — no changed package outputs require rebuilding.**'
            elif [[ -z "$TARGETS" ]]; then
              echo '**Failed — target discovery produced no matrix.**'
            elif [[ "$CHECK_RESULT" == success ]]; then
              echo "**Passed — all $(jq -r 'length' <<< "$TARGETS") affected package outputs reproduced.**"
            else
              echo "**Failed — one or more of $(jq -r 'length' <<< "$TARGETS") affected package checks did not pass.**"
              echo 'Open the failing Rebuild jobs for differing files and links to diagnostic archives.'
              echo
              echo "[View workflow jobs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$DISCOVER_RESULT" == success ]] || exit 1
          [[ "$TARGETS" == '[]' ]] && exit 0
          [[ -n "$TARGETS" && "$CHECK_RESULT" == success ]] || exit 1

      - name: Assign maintainer on failed automated update
        if: >-
          failure() &&
          needs.check.result == 'failure' &&
          github.event.pull_request.user.login == vars.AUTOMATION_APP_BOT_LOGIN &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.pull_request.head.ref == 'automated/package-updates' ||
           github.event.pull_request.head.ref == 'automated/nixpkgs-update')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPDATE_MAINTAINERS: ${{ vars.UPDATE_MAINTAINERS }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$UPDATE_MAINTAINERS" ]]; then
            gh pr edit "$PR_NUMBER" \
              --add-assignee "$UPDATE_MAINTAINERS"
          fi

      - name: Update reproducibility failure comment
        if: >-
          always() && !cancelled() &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TARGETS: ${{ needs.discover.outputs.targets }}
        run: |
          set -euo pipefail

          marker='<!-- nix-opendeck-reproducibility -->'
          comment_id=$(
            gh api --paginate \
              "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains("<!-- nix-opendeck-reproducibility -->"))) | .id' \
            | tail -n 1
          )

          # A passing or unrequested check must not leave a stale failure comment.
          if [[ "$DISCOVER_RESULT" == skipped ]] ||
             [[ "$DISCOVER_RESULT" == success && "$TARGETS" == '[]' ]] ||
             [[ "$DISCOVER_RESULT" == success && -n "$TARGETS" && "$CHECK_RESULT" == success ]]; then
            if [[ -n "$comment_id" ]]; then
              gh api --method DELETE "repos/$GH_REPO/issues/comments/$comment_id" > /dev/null
            fi
            exit 0
          fi

          body="$RUNNER_TEMP/reproducibility-comment.md"
          payload="$RUNNER_TEMP/reproducibility-comment.json"
          {
            echo "$marker"
            echo '### Reproducibility verification failed'
            echo
            echo "- Target discovery: \`$DISCOVER_RESULT\`"
            echo "- Rebuild jobs: \`$CHECK_RESULT\`"
            echo
            echo 'Check the failing rebuild jobs and any diagnostic artifacts:'
            echo "[View this workflow run]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)"
          } > "$body"
          jq -Rs '{body: .}' "$body" > "$payload"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" --input "$payload" > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" --input "$payload" > /dev/null
          fi
