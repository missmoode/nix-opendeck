name: Update packages

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

# Updaters and native builders use only read access. A short-lived GitHub App
# token is created in the final job, after the proposed changes are validated.
permissions:
  contents: read

concurrency:
  group: nix-opendeck-maintenance-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      updaters: ${{ steps.targets.outputs.updaters }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Record source revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test package update orchestrator
        run: python3 -m unittest discover -s .github/ci -p 'test_package_updates.py'
      - name: Test upstream compatibility routing
        run: python3 -m unittest discover -s .github/ci -p 'test_upstream_compatibility.py'
      - name: Test failed-update diagnostics and deduplication
        run: python3 -m unittest discover -s .github/ci -p 'test_failure_audit.py'
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - name: Discover every supported updater
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/discovery"
          nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              systems = builtins.attrNames flake.packages;
            in
              builtins.concatLists (map (system:
                let
                  targets = import ./.github/ci/targets.nix { inherit flake system; };
                  core = flake.packages.${system}.opendeck-core;
                in
                  [ targets.opendeck ] ++ targets.plugins ++ [ {
                    inherit system;
                    inherit (targets.opendeck) runner;
                    kind = "core";
                    label = "opendeck-core";
                    attr = "packages.${system}.opendeck-core";
                    updatable = (core.updateScript or null) != null;
                  } ]
              ) systems)
          ' > "$RUNNER_TEMP/discovery/targets.json"
          python3 .github/ci/package_updates.py discover \
            --targets "$RUNNER_TEMP/discovery/targets.json" \
            --output "$RUNNER_TEMP/discovery"
          echo "updaters=$(jq -c '.updaters' "$RUNNER_TEMP/discovery/plan.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: package-update-discovery
          path: ${{ runner.temp }}/discovery/
          if-no-files-found: error
          retention-days: 7

  update:
    name: 'Update: ${{ matrix.system }}'
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.updaters != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.updaters) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: package-update-discovery
          path: ${{ runner.temp }}/discovery
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          skipPush: true
      - name: Install nix-update
        shell: bash
        run: |
          set -euo pipefail
          # Resolve nixpkgs from this repository's flake.lock, not the runner's registry.
          nix profile add --inputs-from . nixpkgs#nix-update
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          nixpkgs_path=$(nix eval --impure --raw --expr \
            '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')
          echo "NIX_PATH=nixpkgs=$nixpkgs_path" >> "$GITHUB_ENV"
      - name: Update each source once (no builds here)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATE_SYSTEM: ${{ matrix.system }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/package_updates.py update \
            --plan "$RUNNER_TEMP/discovery/plan.json" \
            --system "$UPDATE_SYSTEM" \
            --output "$RUNNER_TEMP/updates/updates-$UPDATE_SYSTEM"
      - name: Upload proposed patches and updater results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updates-${{ matrix.system }}
          path: ${{ runner.temp }}/updates/
          if-no-files-found: warn
          retention-days: 7

  prepare-builds:
    needs: [discover, update]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.plan.outputs.plugins }}
      opendeck: ${{ steps.plan.outputs.opendeck }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: package-update-discovery
          path: ${{ runner.temp }}/discovery
      - uses: actions/download-artifact@v8
        with:
          pattern: updates-*
          path: ${{ runner.temp }}/updates
          merge-multiple: true
        continue-on-error: true
      - name: Plan native builds for changed packages
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/package_updates.py prepare \
            --plan "$RUNNER_TEMP/discovery/plan.json" \
            --targets "$RUNNER_TEMP/discovery/targets.json" \
            --updates "$RUNNER_TEMP/updates" \
            --output "$RUNNER_TEMP/build-plan"
          echo "plugins=$(jq -c '.' "$RUNNER_TEMP/build-plan/plugins.json")" >> "$GITHUB_OUTPUT"
          echo "opendeck=$(jq -c '.' "$RUNNER_TEMP/build-plan/opendeck.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: package-update-build-plan
          path: ${{ runner.temp }}/build-plan/
          if-no-files-found: error
          retention-days: 7

  plugins:
    name: 'Plugin: ${{ matrix.label }} / ${{ matrix.system }}'
    needs: [discover, prepare-builds]
    if: needs.prepare-builds.result == 'success' && needs.prepare-builds.outputs.plugins != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.prepare-builds.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: updates-*
          path: ${{ runner.temp }}/updates
          merge-multiple: true
        continue-on-error: true
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          skipPush: true
      - name: Build proposed plugin
        env:
          TARGET: ${{ toJSON(matrix) }}
        run: |
          python3 .github/ci/package_updates.py build \
            --updates "$RUNNER_TEMP/updates" \
            --output "$RUNNER_TEMP/build-reports/build-${{ matrix.id }}-${{ matrix.system }}/result.json"
      - name: Upload native build result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.id }}-${{ matrix.system }}
          path: ${{ runner.temp }}/build-reports/
          if-no-files-found: warn
          retention-days: 7

  opendeck:
    name: 'OpenDeck: ${{ matrix.system }}'
    needs: [discover, prepare-builds]
    if: needs.prepare-builds.result == 'success' && needs.prepare-builds.outputs.opendeck != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.prepare-builds.outputs.opendeck) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: updates-*
          path: ${{ runner.temp }}/updates
          merge-multiple: true
        continue-on-error: true
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          skipPush: true
      - name: Build proposed default OpenDeck bundle
        env:
          TARGET: ${{ toJSON(matrix) }}
        run: |
          python3 .github/ci/package_updates.py build \
            --updates "$RUNNER_TEMP/updates" \
            --output "$RUNNER_TEMP/build-reports/build-opendeck-${{ matrix.system }}/result.json"
      - name: Upload native build result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-opendeck-${{ matrix.system }}
          path: ${{ runner.temp }}/build-reports/
          if-no-files-found: warn
          retention-days: 7

  finalize:
    environment:
      name: trusted-automation
      deployment: false
    needs: [discover, update, prepare-builds, plugins, opendeck]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # Proposed changes are evaluated here; only the PR action needs
          # write access, via the short-lived GitHub App token.
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: needs.discover.result == 'success'
        with:
          name: package-update-discovery
          path: ${{ runner.temp }}/discovery
      - uses: actions/download-artifact@v8
        if: needs.prepare-builds.result == 'success'
        with:
          name: package-update-build-plan
          path: ${{ runner.temp }}/build-plan
      - uses: actions/download-artifact@v8
        if: needs.prepare-builds.result == 'success'
        with:
          pattern: updates-*
          path: ${{ runner.temp }}/updates
          merge-multiple: true
        continue-on-error: true
      - uses: actions/download-artifact@v8
        if: needs.prepare-builds.result == 'success' && (needs.plugins.result != 'skipped' || needs.opendeck.result != 'skipped')
        with:
          pattern: build-*
          path: ${{ runner.temp }}/builds
          merge-multiple: true
        continue-on-error: true
      - uses: cachix/install-nix-action@v31
        if: needs.prepare-builds.result == 'success'
        with:
          github_access_token: ${{ github.token }}
      - name: Verify base revision and assemble passing updates
        id: finish
        if: needs.prepare-builds.result == 'success'
        shell: bash
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH"
          if [[ "$(git rev-parse HEAD)" == "$BASE_SHA" &&
                "$(git rev-parse "origin/$BASE_BRANCH")" == "$BASE_SHA" ]]; then
            base_unchanged=true
          else
            base_unchanged=false
          fi
          python3 .github/ci/package_updates.py finalize \
            --plan "$RUNNER_TEMP/discovery/plan.json" \
            --prepared "$RUNNER_TEMP/build-plan/prepared.json" \
            --updates "$RUNNER_TEMP/updates" \
            --builds "$RUNNER_TEMP/builds" \
            --base-unchanged "$base_unchanged" \
            --report "$RUNNER_TEMP/package-update-report.md" \
            --pr-report "$RUNNER_TEMP/package-update-pr.md" \
            --state "$RUNNER_TEMP/package-update-state.json"
          cat "$RUNNER_TEMP/package-update-report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=$(jq -r '.ready' "$RUNNER_TEMP/package-update-state.json")" >> "$GITHUB_OUTPUT"
          echo "infrastructure_failure=$(jq -r '.infrastructureFailure' "$RUNNER_TEMP/package-update-state.json")" >> "$GITHUB_OUTPUT"
      # Only accepted upstream version bumps of patched packages require manual
      # review. Core + Starter Pack stay together if updated in the same run.
      - name: Route accepted updates to auto-merge and manual-review PRs
        id: audit-select
        if: steps.finish.outputs.ready == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          UPDATE_MAINTAINERS: ${{ vars.UPDATE_MAINTAINERS }}
        run: |
          set -euo pipefail
          routes="$RUNNER_TEMP/upstream-audit-targets.json"
          python3 .github/ci/upstream_compatibility.py select \
            --base-sha "$BASE_SHA" \
            --state "$RUNNER_TEMP/package-update-state.json" \
            --output "$routes"
          python3 .github/ci/upstream_compatibility.py pr-bodies \
            --routes "$routes" \
            --auto "$RUNNER_TEMP/package-update-auto-pr.md" \
            --review "$RUNNER_TEMP/package-update-review-pr.md"
          review_count=$(jq -r '.reviewPaths | length' "$routes")
          auto_count=$(jq -r '.autoPaths | length' "$routes")
          if [[ "$review_count" != 0 && -z "$(printf '%s' "$UPDATE_MAINTAINERS" | tr -d '[:space:],')" ]]; then
            echo '::error::Set the existing UPDATE_MAINTAINERS repository variable to one or more GitHub usernames.'
            exit 1
          fi
          {
            echo "review_count=$review_count"
            echo "auto_count=$auto_count"
            echo "audit_count=$(jq -r '.auditTargets | length' "$routes")"
            echo 'review_paths<<END_REVIEW_PATHS'
            jq -r '.reviewPaths[]' "$routes"
            echo 'END_REVIEW_PATHS'
            echo 'auto_paths<<END_AUTO_PATHS'
            jq -r '.autoPaths[]' "$routes"
            echo 'END_AUTO_PATHS'
          } >> "$GITHUB_OUTPUT"
          # create-pull-request's add-paths must start with an unstaged tree,
          # otherwise the first PR can accidentally include the other group.
          git reset --quiet

      # AI cannot execute commands or decide whether a reviewed update merges.
      # The only credential here is a Gemini API environment secret.
      - name: Review patched upstream updates with Gemini
        if: steps.audit-select.outcome == 'success' && steps.audit-select.outputs.audit_count != '0'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 .github/ci/upstream_compatibility.py review \
            --targets "$RUNNER_TEMP/upstream-audit-targets.json" \
            --output "$RUNNER_TEMP/upstream-compatibility.md"
      - name: Report infrastructure failure
        if: >-
          always() &&
          (needs.prepare-builds.result != 'success' ||
           steps.finish.outcome != 'success' ||
           steps.finish.outputs.infrastructure_failure == 'true')
        shell: bash
        env:
          DISCOVER: ${{ needs.discover.result }}
          UPDATE: ${{ needs.update.result }}
          PREPARE: ${{ needs.prepare-builds.result }}
          PLUGINS: ${{ needs.plugins.result }}
          OPENDECK: ${{ needs.opendeck.result }}
          INFRASTRUCTURE_FAILURE: ${{ steps.finish.outputs.infrastructure_failure }}
        run: |
          {
            echo '## Package update infrastructure failure'
            echo
            echo "- Discovery: $DISCOVER"
            echo "- Updaters: $UPDATE"
            echo "- Build preparation: $PREPARE"
            echo "- Plugin builds: $PLUGINS"
            echo "- OpenDeck builds: $OPENDECK"
            echo
            echo "[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            if [[ "$INFRASTRUCTURE_FAILURE" == true ]]; then
              echo
              jq -r '.infrastructureErrors[] | "- " + .' "$RUNNER_TEMP/package-update-state.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Generate the token as late as possible; it expires after one hour.
      - name: Generate automation token
        id: app-token
        if: steps.finish.outcome == 'success' && steps.finish.outputs.infrastructure_failure == 'false'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Separate manually reviewed upstream updates from ordinary auto-updates.
      - name: Create or update patched-package manual review PR
        id: review-pr
        if: steps.audit-select.outcome == 'success' && steps.audit-select.outputs.review_count != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          base: ${{ github.ref_name }}
          branch: ${{ github.ref_name == github.event.repository.default_branch && 'automated/patched-package-updates' || format('automated/patched-package-updates-{0}', github.ref_name) }}
          delete-branch: true
          add-paths: ${{ steps.audit-select.outputs.review_paths }}
          title: 'chore: review patched OpenDeck package updates'
          commit-message: 'chore: update patched OpenDeck packages'
          body-path: ${{ runner.temp }}/package-update-review-pr.md
          assignees: ${{ vars.UPDATE_MAINTAINERS }}
          labels: |
            updates
            upstream
            ready for merge

      # Reuse the existing App token; keep one bot-owned compatibility comment.
      - name: Publish upstream compatibility review
        if: steps.review-pr.outputs.pull-request-number != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          PR_NUMBER: ${{ steps.review-pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/upstream-compatibility.md"
          if [[ ! -s "$report" ]]; then
            python3 .github/ci/upstream_compatibility.py unavailable \
              --targets "$RUNNER_TEMP/upstream-audit-targets.json" \
              --output "$report"
          fi
          existing=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            | jq -r --arg bot "$APP_BOT_LOGIN" '.[] | select(.user.login == $bot and (.body | contains("<!-- nix-opendeck-upstream-audit -->"))) | .id' \
            | tail -n 1)
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F "body=@$report" >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -F "body=@$report" >/dev/null
          fi

      - name: Create or update PR containing ordinary validated sources
        id: pr
        if: steps.audit-select.outcome == 'success' && steps.audit-select.outputs.auto_count != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          base: ${{ github.ref_name }}
          branch: ${{ github.ref_name == github.event.repository.default_branch && 'automated/package-updates' || format('automated/package-updates-{0}', github.ref_name) }}
          delete-branch: true
          add-paths: ${{ steps.audit-select.outputs.auto_paths }}
          title: 'chore: update OpenDeck packages'
          commit-message: 'chore: update OpenDeck packages'
          body-path: ${{ runner.temp }}/package-update-auto-pr.md
          labels: |
            updates
            upstream
            ready for merge

      # One persistent issue tracks known package failures. Do not treat missing
      # or corrupt validation reports as recoverable package failures.
      - name: Reconcile package update failures
        id: issues
        # Notifications are useful but should not prevent other valid updates
        # from enabling auto-merge. The final step still flags this failure.
        continue-on-error: true
        if: steps.app-token.outcome == 'success' && github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/package-update-state.json"
          title='Automated package update failures'
          issue=$(gh issue list --state all --limit 100 \
            --search 'Automated package update failures in:title' \
            --json number,title,state \
            --jq 'map(select(.title == "Automated package update failures")) | first // {}')
          number=$(jq -r '.number // empty' <<< "$issue")
          status=$(jq -r '.state // empty' <<< "$issue")

          if jq -e '.packageFailures | length > 0' "$state" > /dev/null; then
            body="$RUNNER_TEMP/package-update-issue.md"
            python3 .github/ci/package_updates.py failure-issue --state "$state" --output "$body"
            marker=$(head -n 1 "$body")

            if [[ -z "$number" ]]; then
              created=$(gh issue create --title "$title" --body-file "$body")
              number=${created##*/}
            else
              existing_body=$(gh issue view "$number" --json body --jq .body)
              if [[ "$status" == CLOSED ]]; then
                gh issue reopen "$number"
              fi
              if [[ "$status" == CLOSED || "$existing_body" != *"$marker"* ]]; then
                gh issue edit "$number" --body-file "$body"
              fi
            fi
            echo "number=$number" >> "$GITHUB_OUTPUT"
          elif [[ -n "$number" && "$status" == OPEN ]]; then
            gh issue close "$number" --reason completed
          fi

      # Only changed-version builds with concrete patch-related diagnostics
      # warrant an AI diagnosis. Selection has no API credentials or side effects.
      - name: Select patch-related failed updates
        id: failure-select
        if: steps.issues.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/failure_audit.py select \
            --prepared "$RUNNER_TEMP/build-plan/prepared.json" \
            --updates "$RUNNER_TEMP/updates" \
            --builds "$RUNNER_TEMP/builds" \
            --output "$RUNNER_TEMP/failure-audit-candidates.json"
          echo "count=$(jq length "$RUNNER_TEMP/failure-audit-candidates.json")" >> "$GITHUB_OUTPUT"

      # Reserve before using Gemini, so later scheduled runs cannot re-submit
      # exactly the same upstream update and downstream patch combination.
      - name: Reserve new failure diagnoses in existing issue
        id: failure-reserve
        if: steps.failure-select.outcome == 'success' && steps.failure-select.outputs.count != '0'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          ISSUE_NUMBER: ${{ steps.issues.outputs.number }}
        run: |
          set -euo pipefail
          python3 .github/ci/failure_audit.py reserve \
            --candidates "$RUNNER_TEMP/failure-audit-candidates.json" \
            --output "$RUNNER_TEMP/failure-audit-reservations.json"
          echo "count=$(jq length "$RUNNER_TEMP/failure-audit-reservations.json")" >> "$GITHUB_OUTPUT"

      # Only Gemini's secret is available to this step, not the GitHub App token.
      - name: Diagnose newly failed downstream patches with Gemini
        if: steps.failure-reserve.outcome == 'success' && steps.failure-reserve.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 .github/ci/failure_audit.py review \
            --reservations "$RUNNER_TEMP/failure-audit-reservations.json" \
            --output "$RUNNER_TEMP/failure-audit-reviews.json"

      # Even a timed-out or unavailable model gets a clear final issue comment.
      - name: Publish failure diagnoses
        id: failure-publish
        if: always() && steps.failure-reserve.outcome == 'success' && steps.failure-reserve.outputs.count != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 .github/ci/failure_audit.py publish \
            --reservations "$RUNNER_TEMP/failure-audit-reservations.json" \
            --reviews "$RUNNER_TEMP/failure-audit-reviews.json"

      # A failed package does not prevent merging other validated updates.
      - name: Enable auto-merge for validated updates
        id: merge
        if: >-
          github.ref_name == github.event.repository.default_branch &&
          steps.pr.outputs.pull-request-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --auto \
            --squash \
            --match-head-commit "$PR_HEAD_SHA"
          echo "Auto-merge requested for PR #$PR_NUMBER; required checks must pass." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Fail after reporting all errors
        if: >-
          always() && (
          needs.discover.result != 'success' ||
          (needs.update.result != 'success' && needs.update.result != 'skipped') ||
          needs.prepare-builds.result != 'success' ||
          steps.finish.outcome != 'success' ||
          steps.finish.outputs.infrastructure_failure != 'false' ||
          (steps.finish.outputs.ready == 'true' && steps.audit-select.outcome != 'success') ||
          steps.review-pr.outcome == 'failure' ||
          steps.app-token.outcome != 'success' ||
          (github.ref_name == github.event.repository.default_branch &&
           steps.issues.outcome != 'success') ||
          steps.failure-select.outcome == 'failure' ||
          steps.failure-reserve.outcome == 'failure' ||
          steps.failure-publish.outcome == 'failure' ||
          steps.pr.outcome == 'failure' ||
          (steps.audit-select.outcome == 'success' &&
           steps.audit-select.outputs.auto_count != '0' &&
           steps.pr.outputs.pull-request-number == '') ||
          (steps.audit-select.outcome == 'success' &&
           steps.audit-select.outputs.review_count != '0' &&
           steps.review-pr.outputs.pull-request-number == '') ||
          (github.ref_name == github.event.repository.default_branch &&
           steps.audit-select.outcome == 'success' &&
           steps.audit-select.outputs.auto_count != '0' &&
           steps.merge.outcome != 'success')
          )
        run: exit 1
