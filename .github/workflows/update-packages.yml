name: Update packages

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

# Updaters and native builders use only read access. A short-lived GitHub App
# token is created in the final job, after the proposed changes are validated.
permissions:
  contents: read

concurrency:
  group: nix-opendeck-maintenance-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      updaters: ${{ steps.targets.outputs.updaters }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Record source revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test package update orchestrator
        run: python3 -m unittest discover -s .github/ci -p 'test_package_updates.py'
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - name: Discover every supported updater
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/discovery"
          nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              systems = builtins.attrNames flake.packages;
            in
              builtins.concatLists (map (system:
                let
                  targets = import ./.github/ci/targets.nix { inherit flake system; };
                  core = flake.packages.${system}.opendeck-core;
                in
                  [ targets.opendeck ] ++ targets.plugins ++ [ {
                    inherit system;
                    inherit (targets.opendeck) runner;
                    kind = "core";
                    label = "opendeck-core";
                    attr = "packages.${system}.opendeck-core";
                    updatable = (core.updateScript or null) != null;
                  } ]
              ) systems)
          ' > "$RUNNER_TEMP/discovery/targets.json"
          python3 .github/ci/package_updates.py discover \
            --targets "$RUNNER_TEMP/discovery/targets.json" \
            --output "$RUNNER_TEMP/discovery"
          echo "updaters=$(jq -c '.updaters' "$RUNNER_TEMP/discovery/plan.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: package-update-discovery
          path: ${{ runner.temp }}/discovery/
          if-no-files-found: error
          retention-days: 7

  update:
    name: 'Update: ${{ matrix.system }}'
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.updaters != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.updaters) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: package-update-discovery
          path: ${{ runner.temp }}/discovery
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          skipPush: true
      - name: Install nix-update
        shell: bash
        run: |
          set -euo pipefail
          # Resolve nixpkgs from this repository's flake.lock, not the runner's registry.
          nix profile add --inputs-from . nixpkgs#nix-update
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          nixpkgs_path=$(nix eval --impure --raw --expr \
            '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')
          echo "NIX_PATH=nixpkgs=$nixpkgs_path" >> "$GITHUB_ENV"
      - name: Update each source once (no builds here)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATE_SYSTEM: ${{ matrix.system }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/package_updates.py update \
            --plan "$RUNNER_TEMP/discovery/plan.json" \
            --system "$UPDATE_SYSTEM" \
            --output "$RUNNER_TEMP/updates/updates-$UPDATE_SYSTEM"
      - name: Upload proposed patches and updater results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updates-${{ matrix.system }}
          path: ${{ runner.temp }}/updates/
          if-no-files-found: warn
          retention-days: 7

  prepare-builds:
    needs: [discover, update]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.plan.outputs.plugins }}
      opendeck: ${{ steps.plan.outputs.opendeck }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: package-update-discovery
          path: ${{ runner.temp }}/discovery
      - uses: actions/download-artifact@v8
        with:
          pattern: updates-*
          path: ${{ runner.temp }}/updates
          merge-multiple: true
        continue-on-error: true
      - name: Plan native builds for changed packages
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/package_updates.py prepare \
            --plan "$RUNNER_TEMP/discovery/plan.json" \
            --targets "$RUNNER_TEMP/discovery/targets.json" \
            --updates "$RUNNER_TEMP/updates" \
            --output "$RUNNER_TEMP/build-plan"
          echo "plugins=$(jq -c '.' "$RUNNER_TEMP/build-plan/plugins.json")" >> "$GITHUB_OUTPUT"
          echo "opendeck=$(jq -c '.' "$RUNNER_TEMP/build-plan/opendeck.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: package-update-build-plan
          path: ${{ runner.temp }}/build-plan/
          if-no-files-found: error
          retention-days: 7

  plugins:
    name: 'Plugin: ${{ matrix.label }} / ${{ matrix.system }}'
    needs: [discover, prepare-builds]
    if: needs.prepare-builds.result == 'success' && needs.prepare-builds.outputs.plugins != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.prepare-builds.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: updates-*
          path: ${{ runner.temp }}/updates
          merge-multiple: true
        continue-on-error: true
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          skipPush: true
      - name: Build proposed plugin
        env:
          TARGET: ${{ toJSON(matrix) }}
        run: |
          python3 .github/ci/package_updates.py build \
            --updates "$RUNNER_TEMP/updates" \
            --output "$RUNNER_TEMP/build-reports/build-${{ matrix.id }}-${{ matrix.system }}/result.json"
      - name: Upload native build result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.id }}-${{ matrix.system }}
          path: ${{ runner.temp }}/build-reports/
          if-no-files-found: warn
          retention-days: 7

  opendeck:
    name: 'OpenDeck: ${{ matrix.system }}'
    needs: [discover, prepare-builds]
    if: needs.prepare-builds.result == 'success' && needs.prepare-builds.outputs.opendeck != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.prepare-builds.outputs.opendeck) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: updates-*
          path: ${{ runner.temp }}/updates
          merge-multiple: true
        continue-on-error: true
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          skipPush: true
      - name: Build proposed default OpenDeck bundle
        env:
          TARGET: ${{ toJSON(matrix) }}
        run: |
          python3 .github/ci/package_updates.py build \
            --updates "$RUNNER_TEMP/updates" \
            --output "$RUNNER_TEMP/build-reports/build-opendeck-${{ matrix.system }}/result.json"
      - name: Upload native build result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-opendeck-${{ matrix.system }}
          path: ${{ runner.temp }}/build-reports/
          if-no-files-found: warn
          retention-days: 7

  finalize:
    needs: [discover, update, prepare-builds, plugins, opendeck]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # Proposed changes are evaluated here; only the PR action needs
          # write access, via the short-lived GitHub App token.
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: needs.discover.result == 'success'
        with:
          name: package-update-discovery
          path: ${{ runner.temp }}/discovery
      - uses: actions/download-artifact@v8
        if: needs.prepare-builds.result == 'success'
        with:
          name: package-update-build-plan
          path: ${{ runner.temp }}/build-plan
      - uses: actions/download-artifact@v8
        if: needs.prepare-builds.result == 'success'
        with:
          pattern: updates-*
          path: ${{ runner.temp }}/updates
          merge-multiple: true
        continue-on-error: true
      - uses: actions/download-artifact@v8
        if: needs.prepare-builds.result == 'success' && (needs.plugins.result != 'skipped' || needs.opendeck.result != 'skipped')
        with:
          pattern: build-*
          path: ${{ runner.temp }}/builds
          merge-multiple: true
        continue-on-error: true
      - uses: cachix/install-nix-action@v31
        if: needs.prepare-builds.result == 'success'
        with:
          github_access_token: ${{ github.token }}
      - name: Verify base revision and assemble passing updates
        id: finish
        if: needs.prepare-builds.result == 'success'
        shell: bash
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH"
          if [[ "$(git rev-parse HEAD)" == "$BASE_SHA" &&
                "$(git rev-parse "origin/$BASE_BRANCH")" == "$BASE_SHA" ]]; then
            base_unchanged=true
          else
            base_unchanged=false
          fi
          python3 .github/ci/package_updates.py finalize \
            --plan "$RUNNER_TEMP/discovery/plan.json" \
            --prepared "$RUNNER_TEMP/build-plan/prepared.json" \
            --updates "$RUNNER_TEMP/updates" \
            --builds "$RUNNER_TEMP/builds" \
            --base-unchanged "$base_unchanged" \
            --report "$RUNNER_TEMP/package-update-report.md" \
            --pr-report "$RUNNER_TEMP/package-update-pr.md" \
            --state "$RUNNER_TEMP/package-update-state.json"
          cat "$RUNNER_TEMP/package-update-report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=$(jq -r '.ready' "$RUNNER_TEMP/package-update-state.json")" >> "$GITHUB_OUTPUT"
          echo "infrastructure_failure=$(jq -r '.infrastructureFailure' "$RUNNER_TEMP/package-update-state.json")" >> "$GITHUB_OUTPUT"
      - name: Report infrastructure failure
        if: >-
          always() &&
          (needs.prepare-builds.result != 'success' ||
           steps.finish.outcome != 'success' ||
           steps.finish.outputs.infrastructure_failure == 'true')
        shell: bash
        env:
          DISCOVER: ${{ needs.discover.result }}
          UPDATE: ${{ needs.update.result }}
          PREPARE: ${{ needs.prepare-builds.result }}
          PLUGINS: ${{ needs.plugins.result }}
          OPENDECK: ${{ needs.opendeck.result }}
          INFRASTRUCTURE_FAILURE: ${{ steps.finish.outputs.infrastructure_failure }}
        run: |
          {
            echo '## Package update infrastructure failure'
            echo
            echo "- Discovery: $DISCOVER"
            echo "- Updaters: $UPDATE"
            echo "- Build preparation: $PREPARE"
            echo "- Plugin builds: $PLUGINS"
            echo "- OpenDeck builds: $OPENDECK"
            echo
            echo "[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            if [[ "$INFRASTRUCTURE_FAILURE" == true ]]; then
              echo
              jq -r '.infrastructureErrors[] | "- " + .' "$RUNNER_TEMP/package-update-state.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Generate the token as late as possible; it expires after one hour.
      - name: Generate automation token
        id: app-token
        if: steps.finish.outcome == 'success' && steps.finish.outputs.infrastructure_failure == 'false'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Create or update PR containing validated sources
        id: pr
        if: steps.finish.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          base: ${{ github.ref_name }}
          branch: ${{ github.ref_name == github.event.repository.default_branch && 'automated/package-updates' || format('automated/package-updates-{0}', github.ref_name) }}
          delete-branch: true
          title: 'chore: update OpenDeck packages'
          commit-message: 'chore: update OpenDeck packages'
          body-path: ${{ runner.temp }}/package-update-pr.md
          labels: |
            updates
            upstream
            ready for merge

      # One persistent issue tracks known package failures. Do not treat missing
      # or corrupt validation reports as recoverable package failures.
      - name: Reconcile package update failures
        id: issues
        if: steps.app-token.outcome == 'success' && github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/package-update-state.json"
          title='Automated package update failures'
          issue=$(gh issue list --state all --limit 100 \
            --search 'Automated package update failures in:title' \
            --json number,title,state \
            --jq 'map(select(.title == "Automated package update failures")) | first // {}')
          number=$(jq -r '.number // empty' <<< "$issue")
          status=$(jq -r '.state // empty' <<< "$issue")

          if jq -e '.packageFailures | length > 0' "$state" > /dev/null; then
            fingerprint=$(jq -c '.packageFailures | sort' "$state" | sha256sum | cut -d' ' -f1)
            marker="<!-- nix-opendeck-package-update-failures:$fingerprint -->"
            body="$RUNNER_TEMP/package-update-issue.md"
            {
              printf '%s\n' "$marker"
              echo '## Outstanding package update failures'
              echo
              echo 'The automated updater could not validate the following updates. Successfully validated updates are proposed separately.'
              echo
              jq -r '.packageFailures[] | "- " + .' "$state"
              echo
              echo "[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            } > "$body"

            if [[ -z "$number" ]]; then
              gh issue create --title "$title" --body-file "$body"
            else
              existing_body=$(gh issue view "$number" --json body --jq .body)
              if [[ "$status" == CLOSED ]]; then
                gh issue reopen "$number"
              fi
              if [[ "$status" == CLOSED || "$existing_body" != *"$marker"* ]]; then
                gh issue edit "$number" --body-file "$body"
              fi
            fi
          elif [[ -n "$number" && "$status" == OPEN ]]; then
            gh issue close "$number" --reason completed
          fi

      # A failed package does not prevent merging other validated updates.
      - name: Enable auto-merge for validated updates
        id: merge
        if: >-
          github.ref_name == github.event.repository.default_branch &&
          steps.pr.outputs.pull-request-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --auto \
            --squash \
            --match-head-commit "$PR_HEAD_SHA"
          echo "Auto-merge requested for PR #$PR_NUMBER; required checks must pass." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Fail after reporting all errors
        if: >-
          always() && (
          needs.discover.result != 'success' ||
          needs.update.result != 'success' ||
          needs.prepare-builds.result != 'success' ||
          steps.finish.outcome != 'success' ||
          steps.finish.outputs.infrastructure_failure != 'false' ||
          steps.app-token.outcome != 'success' ||
          (github.ref_name == github.event.repository.default_branch &&
           steps.issues.outcome != 'success') ||
          steps.pr.outcome == 'failure' ||
          (steps.finish.outputs.ready == 'true' &&
           steps.pr.outputs.pull-request-number == '') ||
          (github.ref_name == github.event.repository.default_branch &&
           steps.finish.outputs.ready == 'true' &&
           steps.merge.outcome != 'success')
          )
        run: exit 1
