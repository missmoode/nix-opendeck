name: Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-opendeck-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test package updater
        run: python3 -m unittest discover -s .github/ci -p 'test_package_updates.py'

      - uses: cachix/install-nix-action@v31

      - name: Evaluate all supported systems
        run: nix flake check --no-build --all-systems -L

      - name: Run native checks
        run: nix flake check -L
