# Always run the CI policy from main, never from the proposed PR.
# PR code is deliberately evaluated in a separate read-only job.
name: Checks

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-opendeck-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the proposed PR merge (read-only runner)
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/merge:refs/remotes/origin/ci-pr-merge"
          git worktree add --detach "$RUNNER_TEMP/pr-merge" refs/remotes/origin/ci-pr-merge
          test "$(git -C "$RUNNER_TEMP/pr-merge" rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git -C "$RUNNER_TEMP/pr-merge" rev-parse HEAD^2)" = "$HEAD_SHA"

      - name: Test package updater
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            cd "$RUNNER_TEMP/pr-merge"
          fi
          python3 -m unittest discover -s .github/ci -p 'test_package_updates.py'

      - uses: cachix/install-nix-action@v31

      - name: Evaluate all supported systems
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            cd "$RUNNER_TEMP/pr-merge"
          fi
          nix flake check --no-build --all-systems -L

      - name: Run native checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            cd "$RUNNER_TEMP/pr-merge"
          fi
          nix flake check -L

  # Only this trusted job holds the App credential. It never checks out the
  # PR, reads its artifacts, or runs its scripts.
  result:
    name: Publish trusted tests status
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Generate verification status token
        id: verification-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-statuses: write

      - name: Publish trusted tests status
        shell: bash
        env:
          GH_TOKEN: ${{ steps.verification-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          state=failure
          description='Tests or evaluation failed'
          if [[ "$TEST_RESULT" == success ]]; then
            state=success
            description='Tests and evaluation passed'
          fi

          for sha in "$HEAD_SHA" "$MERGE_SHA"; do
            [[ -n "$sha" && "$sha" != null ]] || continue
            gh api --method POST "repos/$GH_REPO/statuses/$sha" \
              -f state="$state" \
              -f context='nix-opendeck/tests' \
              -f description="$description" \
              -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" > /dev/null
          done
