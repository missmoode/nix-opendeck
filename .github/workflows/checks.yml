# Unprivileged PR tests. The App-issued required status is published by
# trusted-ci-report.yml only after it verifies this workflow was unchanged.
name: Checks
run-name: "Checks PR #${{ github.event.pull_request.number }} merge ${{ github.sha }}"

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-opendeck-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A skipped job is not an approved verification: the App reporter also
    # checks the current PR label before issuing its required status.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ready for merge')
    name: Tests and evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test CI Python components
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/ci -p 'test_*.py'

      - uses: cachix/install-nix-action@v31

      - name: Evaluate all supported systems
        shell: bash
        run: |
          set -euo pipefail
          nix flake check --no-build --all-systems -L

      - name: Run native checks
        shell: bash
        run: |
          set -euo pipefail
          nix flake check -L
