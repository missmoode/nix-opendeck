name: Build and publish binary cache

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Merges made by the update workflows using GITHUB_TOKEN do not
  # start ordinary push workflows.
  workflow_run:
    workflows: ["Update packages", "Update nixpkgs"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: nix-opendeck-cache-main
  cancel-in-progress: true

jobs:
  prepare:
    # Ignore failed or no-change updater runs.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.sha != github.event.workflow_run.head_sha)
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.discover.outputs.plugins }}
      opendeck_missing: ${{ steps.discover.outputs.opendeck_missing }}
      bundled_missing: ${{ steps.discover.outputs.bundled_missing }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31

      - name: Check licenses and find missing cache outputs
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          # Derivation output paths are known at evaluation time. No builds
          # or downloads of plugin binaries are required for this step.
          nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              lib = flake.inputs.nixpkgs.lib;
              packages = flake.packages.x86_64-linux;
              plugins = flake.legacyPackages.x86_64-linux.opendeck-plugins;
              names = attrs: builtins.filter
                (name: name != "recurseForDerivations")
                (builtins.attrNames attrs);
              redistributable = drv:
                let licenses = lib.toList (drv.meta.license or []);
                in licenses != [] &&
                  builtins.all (license: license.redistributable or false) licenses;
            in {
              # Avoid the special Nix `outPath` attribute name here: JSON
              # serialization would coerce each object to a store-path string.
              opendeck = {
                storePath = packages.opendeck.outPath;
                redistributable = redistributable packages.opendeck;
              };
              bundled = {
                storePath = packages.opendeck-with-plugins.outPath;
                redistributable = redistributable packages.opendeck-with-plugins;
              };
              plugins = builtins.concatLists (map (owner:
                map (name:
                  let plugin = plugins.${owner}.${name};
                  in {
                    attr = "legacyPackages.x86_64-linux.opendeck-plugins.${owner}.${name}";
                    label = "${owner}/${name}";
                    storePath = plugin.outPath;
                    redistributable = redistributable plugin;
                  }
                ) (names plugins.${owner})
              ) (names plugins));
            }
          ' > "$RUNNER_TEMP/targets.json"

          if ! jq -e '
            .opendeck.redistributable and
            .bundled.redistributable and
            all(.plugins[]; .redistributable)
          ' "$RUNNER_TEMP/targets.json" > /dev/null; then
            echo 'Missing or non-redistributable license metadata:' >&2
            jq -r '
              if (.opendeck.redistributable | not) then "opendeck" else empty end,
              if (.bundled.redistributable | not) then "opendeck-with-plugins" else empty end,
              (.plugins[] | select(.redistributable | not) | .label)
            ' "$RUNNER_TEMP/targets.json" >&2
            exit 1
          fi

          # A narinfo file identifies an exact published store path.
          # Treat unexpected responses as errors, not as cache misses.
          cache_has() {
            local path="$1" filename hash status
            filename="${path##*/}"
            hash="${filename%%-*}"

            if [[ ! "$hash" =~ ^[0-9a-z]{32}$ ]]; then
              echo "Unexpected Nix store path: $path" >&2
              exit 1
            fi

            status="$(curl --silent --show-error --location --head \
              --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              "https://nix-opendeck.cachix.org/${hash}.narinfo")" || {
              echo "Could not query Cachix for $path" >&2
              exit 1
            }

            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                echo "Unexpected Cachix response ($status) for $path" >&2
                exit 1
                ;;
            esac
          }

          : > "$RUNNER_TEMP/missing-plugins.jsonl"
          while IFS= read -r plugin; do
            path="$(jq -r '.storePath' <<< "$plugin")"
            label="$(jq -r '.label' <<< "$plugin")"
            if cache_has "$path"; then
              echo "Cached: $label"
            else
              echo "Missing: $label"
              jq -c '{attr, label}' <<< "$plugin" \
                >> "$RUNNER_TEMP/missing-plugins.jsonl"
            fi
          done < <(jq -c '.plugins[]' "$RUNNER_TEMP/targets.json")

          plugins="$(jq -sc '.' "$RUNNER_TEMP/missing-plugins.jsonl")"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

          for package in opendeck bundled; do
            path="$(jq -r ".$package.storePath" "$RUNNER_TEMP/targets.json")"
            if cache_has "$path"; then
              echo "${package}_missing=false" >> "$GITHUB_OUTPUT"
              echo "Cached: $package"
            else
              echo "${package}_missing=true" >> "$GITHUB_OUTPUT"
              echo "Missing: $package"
            fi
          done

          {
            echo '## Cache status'
            echo
            echo "- Plugins requiring publication: $(jq 'length' <<< "$plugins")"
            echo "- OpenDeck: $(grep '^opendeck_missing=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2) (missing)"
            echo "- Bundled OpenDeck: $(grep '^bundled_missing=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2) (missing)"
          } >> "$GITHUB_STEP_SUMMARY"

  plugins:
    name: 'Plugin: ${{ matrix.plugin.label }}'
    needs: prepare
    # An empty dynamic matrix is not valid unless the job is skipped first.
    if: needs.prepare.outputs.plugins != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        plugin: ${{ fromJSON(needs.prepare.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build and publish plugin runtime closure
        shell: bash
        env:
          PLUGIN_ATTR: ${{ matrix.plugin.attr }}
        run: |
          set -euo pipefail
          nix build --no-link --print-out-paths -L ".#${PLUGIN_ATTR}" \
            | cachix push nix-opendeck

  opendeck:
    needs: prepare
    if: needs.prepare.outputs.opendeck_missing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build and publish OpenDeck runtime closure
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-link --print-out-paths -L .#opendeck \
            | cachix push nix-opendeck

  bundled:
    needs: [prepare, plugins, opendeck]
    # Skipped upstream jobs are expected when every plugin or OpenDeck
    # is already cached. Still run this job if the bundled output is missing.
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.plugins.result == 'success' || needs.plugins.result == 'skipped') &&
      (needs.opendeck.result == 'success' || needs.opendeck.result == 'skipped') &&
      needs.prepare.outputs.bundled_missing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build and publish bundled OpenDeck runtime closure
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-link --print-out-paths -L .#opendeck-with-plugins \
            | cachix push nix-opendeck
