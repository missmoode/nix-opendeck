name: Build and publish binary cache

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bot-token merges from the updater do not start ordinary push workflows.
  workflow_run:
    workflows: ["Update nixpkgs"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: nix-opendeck-cache-main
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.sha != github.event.workflow_run.head_sha)
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.discover.outputs.plugins }}
      opendeck: ${{ steps.discover.outputs.opendeck }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31

      - name: Discover uncached redistributable targets
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              systems = builtins.attrNames flake.packages;
            in
              builtins.concatLists (map (system:
                let targets = import ./ci/targets.nix { inherit flake system; };
                in [ targets.opendeck ] ++ targets.plugins
              ) systems)
          ' > "$RUNNER_TEMP/targets.json"

          if ! jq -e 'all(.[]; .redistributable)' "$RUNNER_TEMP/targets.json" >/dev/null; then
            echo 'Missing or non-redistributable license metadata:' >&2
            jq -r '.[] | select(.redistributable | not) | "\(.system) / \(.label)"' \
              "$RUNNER_TEMP/targets.json" >&2
            exit 1
          fi

          cache_has() {
            local path="$1" filename hash status
            filename="${path##*/}"
            hash="${filename%%-*}"

            if [[ ! "$hash" =~ ^[0-9a-z]{32}$ ]]; then
              echo "Unexpected Nix store path: $path" >&2
              exit 1
            fi

            status="$(curl --silent --show-error --location --head \
              --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              "https://nix-opendeck.cachix.org/${hash}.narinfo")" || {
              echo "Could not query Cachix for $path" >&2
              exit 1
            }

            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                echo "Unexpected Cachix response ($status) for $path" >&2
                exit 1
                ;;
            esac
          }

          : > "$RUNNER_TEMP/missing-plugins.jsonl"
          : > "$RUNNER_TEMP/missing-opendeck.jsonl"
          while IFS= read -r item; do
            path="$(jq -r '.storePath' <<< "$item")"
            label="$(jq -r '"\(.system) / \(.label)"' <<< "$item")"
            if cache_has "$path"; then
              echo "Cached: $label"
              continue
            fi

            echo "Missing: $label"
            kind="$(jq -r '.kind' <<< "$item")"
            if [[ "$kind" == plugin ]]; then
              jq -c '{system, runner, attr, label}' <<< "$item" \
                >> "$RUNNER_TEMP/missing-plugins.jsonl"
            else
              jq -c '{system, runner, attr, label}' <<< "$item" \
                >> "$RUNNER_TEMP/missing-opendeck.jsonl"
            fi
          done < <(jq -c '.[]' "$RUNNER_TEMP/targets.json")

          plugins="$(jq -sc '.' "$RUNNER_TEMP/missing-plugins.jsonl")"
          opendeck="$(jq -sc '.' "$RUNNER_TEMP/missing-opendeck.jsonl")"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "opendeck=$opendeck" >> "$GITHUB_OUTPUT"

          {
            echo '## Cache status'
            echo
            echo "- Plugins requiring publication: $(jq 'length' <<< "$plugins")"
            echo "- OpenDeck system builds requiring publication: $(jq 'length' <<< "$opendeck")"
          } >> "$GITHUB_STEP_SUMMARY"

  plugins:
    name: 'Plugin: ${{ matrix.system }} / ${{ matrix.label }}'
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.plugins != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build and publish plugin runtime closure
        shell: bash
        env:
          TARGET_ATTR: ${{ matrix.attr }}
        run: |
          set -euo pipefail
          nix build --no-link --print-out-paths -L ".#${TARGET_ATTR}" \
            | cachix push nix-opendeck

  opendeck:
    name: 'OpenDeck: ${{ matrix.system }}'
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.opendeck != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.opendeck) }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build and publish OpenDeck runtime closure
        shell: bash
        env:
          TARGET_ATTR: ${{ matrix.attr }}
        run: |
          set -euo pipefail
          nix build --no-link --print-out-paths -L ".#${TARGET_ATTR}" \
            | cachix push nix-opendeck
