name: Build and publish binary cache

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# nixpkgs updates now publish on their native validation runners before
# auto-merging. A workflow_run trigger would redundantly rebuild/recheck them.
# This workflow still handles direct pushes and manual cache repair.
permissions:
  contents: read

concurrency:
  group: nix-opendeck-cache-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.discover.outputs.plugins }}
      opendeck: ${{ steps.discover.outputs.opendeck }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Discover uncached redistributable targets
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              systems = builtins.attrNames flake.packages;
            in
              builtins.concatLists (map (system:
                let
                  targets = import ./.github/ci/targets.nix {
                    inherit flake system;
                  };
                in
                  [ targets.core targets.opendeck ] ++ targets.plugins
              ) systems)
          ' > "$RUNNER_TEMP/targets.json"

          # Only explicitly redistributable targets may be published.
          # Missing or restrictive license metadata excludes a package
          # from publication, but does not fail the entire workflow.
          jq '[.[] | select(.redistributable == true)]' \
            "$RUNNER_TEMP/targets.json" \
            > "$RUNNER_TEMP/publishable-targets.json"

          cache_has() {
            local path="$1" filename hash status
            filename="${path##*/}"
            hash="${filename%%-*}"

            if [[ ! "$hash" =~ ^[0-9a-z]{32}$ ]]; then
              echo "Unexpected Nix store path: $path" >&2
              exit 1
            fi

            status="$(curl --silent --show-error --location --head \
              --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              "https://nix-opendeck.cachix.org/${hash}.narinfo")" || {
              echo "Could not query Cachix for $path" >&2
              exit 1
            }

            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                echo "Unexpected Cachix response ($status) for $path" >&2
                exit 1
                ;;
            esac
          }

          : > "$RUNNER_TEMP/missing-plugins.jsonl"
          : > "$RUNNER_TEMP/missing-opendeck.jsonl"

          while IFS= read -r item; do
            path="$(jq -r '.storePath' <<< "$item")"
            label="$(jq -r '"\(.system) / \(.label)"' <<< "$item")"

            if cache_has "$path"; then
              echo "Cached: $label"
              continue
            fi

            echo "Missing: $label"

            kind="$(jq -r '.kind' <<< "$item")"

            if [[ "$kind" == plugin ]]; then
              jq -c '{system, runner, attr, label}' <<< "$item" \
                >> "$RUNNER_TEMP/missing-plugins.jsonl"
            else
              jq -c '{system, runner, kind, attr, label}' <<< "$item" \
                >> "$RUNNER_TEMP/missing-opendeck.jsonl"
            fi
          done < <(jq -c '.[]' "$RUNNER_TEMP/publishable-targets.json")

          plugins="$(jq -sc '.' "$RUNNER_TEMP/missing-plugins.jsonl")"

          # One native runner per system for both missing OpenDeck targets.
          # Build core first so the wrapper reuses its already-built output.
          opendeck="$(jq -sc '
            group_by(.system)
            | map(
                sort_by(.kind != "core")
                | {
                    system: .[0].system,
                    runner: .[0].runner,
                    label: (map(.label) | join(" + ")),
                    targets: (map({attr, label}))
                  }
              )
          ' "$RUNNER_TEMP/missing-opendeck.jsonl")"

          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "opendeck=$opendeck" >> "$GITHUB_OUTPUT"

          {
            echo '## Cache status'
            echo
            echo "- Publishable targets: $(jq 'length' "$RUNNER_TEMP/publishable-targets.json")"
            echo "- Excluded by redistribution policy: $(jq '[.[] | select(.redistributable != true)] | length' "$RUNNER_TEMP/targets.json")"
            echo "- Plugins requiring publication: $(jq 'length' <<< "$plugins")"
            echo "- OpenDeck targets requiring publication: $(jq '[.[] | .targets | length] | add // 0' <<< "$opendeck")"
            echo "- Native OpenDeck jobs: $(jq 'length' <<< "$opendeck")"
          } >> "$GITHUB_STEP_SUMMARY"

  plugins:
    name: 'Plugin: ${{ matrix.system }} / ${{ matrix.label }}'
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.plugins != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.plugins) }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          skipPush: true

      - name: Build plugin
        shell: bash
        env:
          TARGET_ATTR: ${{ matrix.attr }}
        run: |
          set -euo pipefail

          nix build --no-link --print-out-paths -L ".#${TARGET_ATTR}" \
            > "$RUNNER_TEMP/built-paths"

          test -s "$RUNNER_TEMP/built-paths"

      - name: Publish plugin runtime closure
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CACHIX_AUTH_TOKEN:-}" ]]; then
            echo '::error::CACHIX_AUTH_TOKEN is missing'
            exit 1
          fi

          cachix push nix-opendeck < "$RUNNER_TEMP/built-paths"

  opendeck:
    name: 'OpenDeck: ${{ matrix.system }} / ${{ matrix.label }}'
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.opendeck != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.opendeck) }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: nix-opendeck
          skipPush: true

      - name: Build and publish OpenDeck targets
        shell: bash
        env:
          TARGETS_JSON: ${{ toJSON(matrix.targets) }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CACHIX_AUTH_TOKEN:-}" ]]; then
            echo '::error::CACHIX_AUTH_TOKEN is missing'
            exit 1
          fi

          jq -c '.[]' <<< "$TARGETS_JSON" > "$RUNNER_TEMP/opendeck-targets.jsonl"
          test -s "$RUNNER_TEMP/opendeck-targets.jsonl"

          # Publish each output immediately. If the wrapper fails, the core
          # has still been built and cached, avoiding another expensive build.
          while IFS= read -r target; do
            attr="$(jq -r '.attr' <<< "$target")"
            label="$(jq -r '.label' <<< "$target")"

            echo "::group::Build and publish $label"
            nix build --no-link --print-out-paths -L ".#${attr}" \
              > "$RUNNER_TEMP/built-paths"

            test -s "$RUNNER_TEMP/built-paths"
            cachix push nix-opendeck < "$RUNNER_TEMP/built-paths"
            echo '::endgroup::'
          done < "$RUNNER_TEMP/opendeck-targets.jsonl"
