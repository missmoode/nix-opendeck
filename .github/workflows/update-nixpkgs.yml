# Propose a nixpkgs lock-file update; the required PR reproducibility check
# performs the native builds. cache.yml publishes outputs after merging.
name: Update nixpkgs

on:
  schedule:
    - cron: '43 5 15 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-opendeck-maintenance-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  update:
    environment:
      name: trusted-automation
      deployment: false
    name: Propose nixpkgs update
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Update nixpkgs lock
        id: update
        shell: bash
        run: |
          set -euo pipefail

          # Keep the separately pinned deno-nixpkgs input untouched.
          nix flake update nixpkgs
          git add flake.lock

          if git diff --cached --quiet -- flake.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'nixpkgs is already up to date.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'changed=true' >> "$GITHUB_OUTPUT"
          old_rev=$(git show HEAD:flake.lock | jq -r '.nodes.nixpkgs.locked.rev')
          new_rev=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)

          {
            echo '## Proposed nixpkgs update'
            echo
            echo "- Old revision: \`$old_rev\`"
            echo "- New revision: \`$new_rev\`"
            echo
            echo 'The required PR reproducibility check validates affected packages.'
            echo 'Once merged, cache.yml publishes missing redistributable outputs.'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo '## Automated nixpkgs update'
            echo
            echo "- Old revision: \`$old_rev\`"
            echo "- New revision: \`$new_rev\`"
            echo
            echo 'Merge is automatic only after the required PR checks pass.'
            echo 'Cache publication follows the merge to main.'
            echo
            echo "[Updater run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > "$RUNNER_TEMP/nixpkgs-report.md"

      # A separately installed GitHub App lets PR checks run automatically.
      # Mint the short-lived token only after confirming an update exists.
      - name: Generate automation token
        id: app-token
        if: steps.update.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update pull request
        id: pr
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          base: ${{ github.ref_name }}
          branch: ${{ github.ref_name == github.event.repository.default_branch && 'automated/nixpkgs-update' || format('automated/nixpkgs-update-{0}', github.ref_name) }}
          delete-branch: true
          title: 'chore: update nixpkgs (unstable)'
          commit-message: 'chore: update nixpkgs'
          add-paths: flake.lock
          body-path: ${{ runner.temp }}/nixpkgs-report.md
          labels: |
            updates
            nixpkgs
            automatically generated
            run checks

      # GitHub, not this job, decides when the required PR checks have passed.
      - name: Enable auto-merge
        if: >-
          github.ref_name == github.event.repository.default_branch &&
          steps.pr.outputs.pull-request-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --auto \
            --squash \
            --match-head-commit "$PR_HEAD_SHA"
          echo "Auto-merge requested for PR #$PR_NUMBER; required checks must pass." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Check PR creation
        if: >-
          steps.update.outputs.changed == 'true' &&
          steps.pr.outputs.pull-request-number == ''
        run: |
          echo '::error::The lock file changed but no pull request was created.'
          exit 1
